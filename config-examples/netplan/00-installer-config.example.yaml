# Exemplo de configuração Netplan do homelab
# Substitua os valores indicados antes de utilizar.

network:
  version: 2

  ethernets:
    enp3s0f1:
      match:
        macaddress: "SEU_MAC_ADDRESS"
      set-name: enp3s0f1

  wifis:
    wlp2s0b1:
      access-points:
        "SEU_SSID":
          password: "SUA_SENHA_WIFI"

      dhcp4: false
      dhcp6: false
      accept-ra: false

      addresses:
        - 192.168.1.62/24

      routes:
        - to: default
          via: 192.168.1.1

      nameservers:
        addresses:
          - 192.168.1.62
